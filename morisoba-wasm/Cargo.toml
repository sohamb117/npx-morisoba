[package]
name = "morisoba-wasm"
version = "0.1.0"
edition = "2021"
description = "MORISOBA WASM port for static-site hosting via ratzilla."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
morisoba = { path = "../morisoba", default-features = false }
ratzilla = "0.3"
ratatui = { version = "0.30", default-features = false }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Performance", "Window"] }
js-sys = "0.3"
