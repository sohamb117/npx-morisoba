[package]
name = "ssh-profile-tui"
version = "0.1.0"
edition = "2021"
description = "Black-and-white brutalist SSH-accessed portfolio TUI"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ssh-profile-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# viuer pulls libsixel via its default feature; disable it so we don't need libsixel-dev.
# kitty + iTerm printers are NOT feature-gated in 0.7, so we still get them.
viuer = { version = "0.7", default-features = false }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
