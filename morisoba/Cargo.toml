[package]
name = "morisoba"
version = "0.1.0"
edition = "2021"
description = "MORISOBA - a black-and-white brutalist portfolio TUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/morisoba/morisoba"
publish = false

[[bin]]
name = "morisoba"
path = "src/main.rs"
required-features = ["native"]

[lib]
name = "morisoba"
path = "src/lib.rs"

[features]
default = ["native"]
native = []

[dependencies]
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
rascii_art = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = "0.30"
crossterm = "0.28"
opener = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratatui = { version = "0.30", default-features = false }
ratzilla = "0.3"
